<!doctype html><html><head><meta charset="utf-8">
<!-- One job video in the "kinetic" style (dark, amber glow, words appear as they are spoken).
     make-video.js fills /*FONTS*/ and /*CFG*/, then calls render(t) for every frame. -->
<style>
/*FONTS*/
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0A0806}
body{width:1080px;height:1920px;overflow:hidden;color:#FFFFFF;
  font-family:'Inter','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Oriya',sans-serif}
.abs{position:absolute}
#bg{inset:0;background:#0A0806}
.glow{border-radius:50%;pointer-events:none}
#vig{inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}
#brand{left:64px;top:70px;font-weight:800;font-size:28px;letter-spacing:7px;color:rgba(255,255,255,.88);display:flex;align-items:center;gap:14px}
#brand b{width:16px;height:16px;border-radius:4px;background:#FACC15;transform:rotate(45deg);box-shadow:0 0 18px rgba(250,204,21,.8)}
#prog{left:0;top:1908px;height:12px;background:linear-gradient(90deg,#B98500,#FACC15 70%,#FFE58A);box-shadow:0 0 22px rgba(250,204,21,.7)}
.fw{font-weight:800;white-space:nowrap;color:#FACC15}
.words{left:60px;width:960px;text-align:center;font-weight:900;line-height:1.14;letter-spacing:-1px}
.words span{display:inline-block;margin:0 .14em;white-space:nowrap}
.words .hl{color:#FACC15}
.words .ul{text-decoration:underline;text-decoration-thickness:.07em;text-underline-offset:.12em}
.lab{font-weight:800;letter-spacing:12px;color:#FACC15;text-align:center;left:0;width:1080px}
.tag{font-weight:900;color:#FF4D6D;border:6px solid #FF4D6D;border-radius:14px;padding:6px 26px;letter-spacing:2px;white-space:nowrap;box-shadow:0 0 30px rgba(255,77,109,.35),inset 0 0 18px rgba(255,77,109,.18);background:rgba(40,0,8,.35)}
.chip{left:110px;width:860px;display:flex;align-items:center;gap:28px;font-weight:900;font-size:50px;line-height:1.1;padding:30px 36px;border-radius:26px;
  background:linear-gradient(90deg,rgba(40,32,12,.92),rgba(22,18,10,.88));border:2px solid rgba(250,204,21,.28);border-left:8px solid #FACC15;box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 40px rgba(250,204,21,.08)}
.chip i{flex:none;width:70px;height:70px;border-radius:16px;background:#22C55E;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:46px;color:#FFFFFF;box-shadow:0 0 22px rgba(34,197,94,.5)}
.pill{display:flex;align-items:center;gap:18px;font-weight:900;font-size:44px;padding:20px 38px;border-radius:999px;border:3px solid rgba(250,204,21,.8);background:rgba(30,24,8,.85);white-space:nowrap;box-shadow:0 0 30px rgba(250,204,21,.25)}
.btn{display:flex;align-items:center;gap:30px;font-weight:900;font-size:170px;letter-spacing:-4px;color:#0A0806;padding:30px 90px 34px;border-radius:999px;
  background:linear-gradient(180deg,#FFE680,#FACC15 55%,#E6A800);box-shadow:0 0 0 10px rgba(250,204,21,.18),0 30px 80px rgba(250,204,21,.35)}
.ring{border-radius:999px;border:4px solid rgba(250,204,21,.6)}
.box{display:flex;align-items:center;gap:24px;font-weight:900;font-size:44px;letter-spacing:1px;white-space:nowrap}
.box i{width:54px;height:54px;border-radius:12px;border:4px solid #FFFFFF;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:38px;color:#0A0806}
.em{height:1em;width:1em;vertical-align:-0.12em;display:inline-block}
.spark{width:14px;height:14px;border-radius:50%;background:#FFE58A;box-shadow:0 0 16px 4px rgba(250,204,21,.8)}
</style></head><body>
<div id="bg" class="abs"></div>
<div id="g1" class="abs glow"></div><div id="g2" class="abs glow"></div>
<div id="floats" class="abs" style="inset:0"></div>
<div id="scene" class="abs" style="inset:0"></div>
<div id="vig" class="abs"></div>
<div id="brand" class="abs"><b></b>REMOTE JOB DROP</div>
<div id="prog" class="abs"></div>
<script>
const CFG = /*CFG*/{};
const Y = '#FACC15';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, p) => a + (b - a) * p;
const eo = x => 1 - Math.pow(1 - clamp(x), 3), eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eb = x => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const scene = document.getElementById('scene');
const EM = n => `<img class="em" src="${CFG.emojiDir}/${n}.svg">`;
function el(html, cls, style, parent) { const d = document.createElement('div'); d.className = 'abs ' + (cls || ''); d.innerHTML = html; Object.assign(d.style, style || {}); (parent || scene).appendChild(d); return d; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function vis(e, on) { e.style.display = on ? '' : 'none'; }
function centerX(e) { e.style.left = Math.round((1080 - e.offsetWidth) / 2) + 'px'; }
function fitWidth(e, max, minSize) { let fs = parseFloat(e.style.fontSize); while (e.scrollWidth > max && fs > minSize) { fs -= 4; e.style.fontSize = fs + 'px'; } }
function popIn(e, t, st, dur, o = {}) {
  const p = clamp((t - st) / (dur || 0.35));
  e.style.opacity = t < st ? 0 : eo(p);
  const sc = o.bounce ? lerp(o.from || 0.4, 1, eb(p)) : lerp(o.from || 1.25, 1, eo(p));
  e.style.transform = `translateY(${(o.y || 0) * (1 - eo(p))}px) scale(${sc})` + (o.rot ? ` rotate(${o.rot}deg)` : '');
  e.style.filter = p < 1 ? `blur(${(o.blur == null ? 16 : o.blur) * (1 - eo(p))}px)` : '';
}
function fadeOut(e, t, et) { const q = clamp((t - (et - 0.22)) / 0.22); if (q > 0) { e.style.opacity = String((parseFloat(e.style.opacity || 1)) * (1 - q)); e.style.filter = `blur(${10 * q}px)`; } }

/* ---------- timing ---------- */
const NAMES = ['hook', 'title', 'pay', 'needs', 'cta'];
const SC = {}; CFG.scenes.forEach(s => SC[s.name] = s);
const OUTRO = 1.9;
const END = SC.cta.e + OUTRO;
const SFX = []; window.SFX = SFX; const sfx = (t, type, g) => SFX.push({ t: +Math.max(0, t).toFixed(3), type, g: g || 1 });
/* When each line is spoken: the voice piece placed in each scene, or most of the scene without a voice. */
const SPEAK = NAMES.map((n, i) => {
  const sp = (CFG.speak || [])[i];
  if (sp) return { s: sp.s, e: sp.e };
  return { s: SC[n].s + 0.35, e: SC[n].e - 0.35 };
});
NAMES.slice(1).forEach(n => sfx(SC[n].s - 0.08, 'whoosh', 0.7));

/* ---------- the job ---------- */
const J = CFG.job || {};
const LINES = CFG.lines || [];
const NATIVE = { Hindi: 'हिन्दी', Bengali: 'বাংলা', Bangla: 'বাংলা', Marathi: 'मराठी', Tamil: 'தமிழ்', Telugu: 'తెలుగు', Gujarati: 'ગુજરાતી', Punjabi: 'ਪੰਜਾਬੀ',
  Kannada: 'ಕನ್ನಡ', Malayalam: 'മലയാളം', Odia: 'ଓଡ଼ିଆ', Oriya: 'ଓଡ଼ିଆ', Nepali: 'नेपाली', Bhojpuri: 'भोजपुरी', Maithili: 'मैथिली', Assamese: 'অসমীয়া',
  English: 'English', Spanish: 'Español', French: 'Français', German: 'Deutsch', Portuguese: 'Português', Italian: 'Italiano' };
const LANG = (() => {
  const src = [CFG.label, J.title, CFG.hookScreen].join(' ');
  return Object.keys(NATIVE).find(k => new RegExp('\\b' + k + '\\b', 'i').test(src)) || '';
})();
const TOPIC_EMOJI = [[/video|record|camera|film/i, '1f3a5'], [/voice|audio|speak|transcri|music/i, '1f399'], [/code|coding|software|developer|engineer|python/i, '1f4bb'],
  [/math|physics|chem|bio|science|stem/i, '1f9ea'], [/law|legal|attorney|lawyer|paralegal/i, '2696'], [/doctor|medic|nurse|health|physician/i, '1fa7a'],
  [/financ|account|bank|invest/i, '1f4b0'], [/design|image|visual|art/i, '1f3a8'], [/writ|editor|content/i, '270d'], [/evaluat|rater|rating|review|test/i, '2705']];
const topicEmoji = (TOPIC_EMOJI.find(([r]) => r.test(J.title || '')) || [0, '1f4bc'])[1];
const TITLE_WORDS = new Set(String(J.title || '').toLowerCase().split(/[^\p{L}\p{N}$]+/u).filter(w => w.length > 2));
const HL_WORDS = new Set(['job', 'jobs', 'hiring', 'remote', 'home', 'free', 'link', 'guide', 'weekly', 'dollar', 'dollars', 'laptop', 'internet', 'घर', 'बैठे', 'फ्री']);
if (LANG) HL_WORDS.add(LANG.toLowerCase());

/* Words that appear as they are spoken. */
function kinetic(text, o) {
  const box = el('', 'words', { top: o.y + 'px', fontSize: (o.size || 84) + 'px' });
  const raw = String(text || '').trim().split(/\s+/).filter(Boolean);
  const spans = raw.map(w => {
    const s = document.createElement('span'); s.textContent = /[a-z]/i.test(w) ? w.toUpperCase() : w;
    const k = w.toLowerCase().replace(/[^\p{L}\p{N}$₹]+/gu, '');
    if (/[$₹\d]/.test(w) || HL_WORDS.has(k) || TITLE_WORDS.has(k)) s.className = 'hl';
    if (/^(job|jobs|hiring|free)$/.test(k)) s.className = 'hl ul';
    box.appendChild(s); return s;
  });
  let fs = o.size || 84; while (box.offsetHeight > (o.maxH || 420) && fs > 44) { fs -= 4; box.style.fontSize = fs + 'px'; }
  /* timing: spread the words over the spoken time, longer words a little longer */
  const lens = raw.map(w => Math.max(2, [...w].length)), tot = lens.reduce((a, b) => a + b, 0) || 1;
  const span = Math.max(0.5, (o.e - o.s) * 0.97);
  let acc = 0; const at = lens.map(l => { const t0 = o.s + span * acc / tot; acc += l; return t0; });
  at.forEach((t0, i) => { if (i % 2 === 0) sfx(t0, 'type', 0.35); });
  return { box, spans, at };
}
function kineticRender(k, t) {
  k.spans.forEach((s, i) => { const p = clamp((t - k.at[i]) / 0.2); s.style.opacity = t < k.at[i] ? 0 : eo(p); s.style.transform = `translateY(${26 * (1 - eo(p))}px) scale(${lerp(1.3, 1, eo(p))})`; s.style.filter = p < 1 ? `blur(${12 * (1 - eo(p))}px)` : ''; });
}

/* ---------- background words ---------- */
const FLOAT = ['हिन्दी', 'Español', 'বাংলা', 'Français', 'தமிழ்', 'English', 'ગુજરાતી', 'Deutsch', 'తెలుగు', 'ਪੰਜਾਬੀ', 'മലയാളം', 'Português'];
const FPOS = [[70, 300], [700, 420], [80, 1530], [700, 1650], [640, 860], [40, 1080], [720, 1250], [300, 1780], [330, 230], [60, 690], [680, 600], [380, 1420]];
const floats = FLOAT.map((w, i) => el(esc(w), 'fw', { left: FPOS[i][0] + 'px', top: FPOS[i][1] + 'px', fontSize: (54 + (i * 7) % 26) + 'px' }, document.getElementById('floats')));

/* ---------- scene 1: hook ---------- */
const H = SC.hook, hSpeak = SPEAK[0];
let hBig, hSub, hCount, hEmoji;
if (LANG && NATIVE[LANG]) {
  hBig = el(esc(NATIVE[LANG]), '', { top: '720px', fontSize: '250px', fontWeight: '900', whiteSpace: 'nowrap', textShadow: '0 0 40px rgba(255,240,200,.35)' });
  fitWidth(hBig, 960, 120); centerX(hBig);
  hSub = el(esc(LANG.toUpperCase()), 'lab', { top: (720 + hBig.offsetHeight + 30) + 'px', fontSize: '40px' });
  hCount = el('01 / ∞', 'lab', { top: (720 + hBig.offsetHeight + 110) + 'px', fontSize: '30px', color: 'rgba(255,255,255,.55)', letterSpacing: '6px' });
} else {
  hEmoji = el(EM(topicEmoji), '', { top: '640px', fontSize: '230px', lineHeight: '1' }); centerX(hEmoji);
}
const hWords = kinetic(LINES[0] || CFG.hookScreen, { y: LANG ? 1340 : 980, size: LANG ? 80 : 104, maxH: LANG ? 300 : 520, s: hSpeak.s, e: hSpeak.e });
/* The pay, shown from the first second so viewers see it before they scroll away. */
const hPayTxt = String(J.pay || '');
const hPayMoney = (hPayTxt.match(/[$₹€£]\s?[\d,.]+[kK]?(\s*[-–]\s*[$₹€£]?\s?[\d,.]+[kK]?)?/) || [''])[0].replace(/\s+/g, '');
const hPayUnit = /hr|hour/i.test(hPayTxt) ? '/HR' : /month|mo\b/i.test(hPayTxt) ? '/MONTH' : /year|yr|annual/i.test(hPayTxt) ? '/YEAR' : '';
const hPay = hPayMoney ? el(EM('1f4b5') + '<span>' + esc((/up to/i.test(hPayTxt) ? 'UP TO ' : '') + hPayMoney + hPayUnit) + '</span>', 'pill', { top: '400px', fontSize: '60px', color: Y }) : null;
if (hPay) { fitWidth(hPay, 980, 36); centerX(hPay); }
sfx(H.s + 0.1, 'swoosh', 0.8);

/* ---------- scene 2: title ---------- */
const T = SC.title, tSpeak = SPEAK[1];
const tTag = el('RIGHT NOW', 'tag', { top: '560px', fontSize: '64px' }); centerX(tTag);
const tTitle = el(esc(String(J.title || '').toUpperCase()), 'words', { top: '730px', fontSize: '104px', color: Y, textShadow: '0 0 34px rgba(250,204,21,.35)' });
{ let fs = 104; while (tTitle.offsetHeight > 380 && fs > 52) { fs -= 4; tTitle.style.fontSize = fs + 'px'; } }
const tWords = kinetic(LINES[1], { y: 770 + Math.max(260, tTitle.offsetHeight) + 40, size: 72, maxH: 420, s: tSpeak.s, e: tSpeak.e });
sfx(T.s + 0.15, 'pop', 0.9);

/* ---------- scene 3: pay ---------- */
const P = SC.pay, pSpeak = SPEAK[2];
const payTxt = String(J.pay || '');
const money = (payTxt.match(/[$₹€£]\s?[\d,.]+[kK]?(\s*[-–]\s*[$₹€£]?\s?[\d,.]+[kK]?)?/) || [payTxt.replace(/^up to\s*/i, '')])[0].replace(/\s+/g, '');
const unit = /hr|hour/i.test(payTxt) ? 'PER HOUR' : /month|mo\b/i.test(payTxt) ? 'PER MONTH' : /year|yr|annual/i.test(payTxt) ? 'PER YEAR' : /task/i.test(payTxt) ? 'PER TASK' : '';
const pLab = el(/up to/i.test(payTxt) ? 'ROLES PAY UP TO' : 'ROLES PAY', '', { top: '640px', fontSize: '62px', fontWeight: '900', whiteSpace: 'nowrap' }); centerX(pLab);
const pBig = el(esc(money), '', { top: '730px', fontSize: '330px', fontWeight: '900', letterSpacing: '-10px', lineHeight: '1', color: Y, whiteSpace: 'nowrap',
  textShadow: '0 0 60px rgba(250,204,21,.55), 0 10px 0 #8a6200' });
fitWidth(pBig, 980, 140); centerX(pBig);
const pUnit = el(esc(unit), '', { top: (730 + pBig.offsetHeight + 20) + 'px', fontSize: '96px', fontWeight: '900', letterSpacing: '4px', whiteSpace: 'nowrap' }); centerX(pUnit);
const pPill = el(EM('1f4c5') + '<span>' + esc(String(J.paid || 'Paid on time').toUpperCase()) + '</span>', 'pill', { top: (730 + pBig.offsetHeight + 170) + 'px' }); centerX(pPill);
const pInr = el(esc(J.inr ? '≈ ' + J.inr : ''), '', { top: (730 + pBig.offsetHeight + 290) + 'px', fontSize: '44px', fontWeight: '800', color: 'rgba(255,255,255,.7)', whiteSpace: 'nowrap' }); centerX(pInr);
const sparks = Array.from({ length: 26 }, (_, i) => el('', 'spark', {}));
const pReveal = Math.max(P.s + 0.25, pSpeak.s + 0.35);
sfx(pReveal, 'thud', 1); sfx(pReveal + 0.05, 'ding', 0.5); sfx(pReveal + 0.55, 'pop', 0.7);

/* ---------- scene 4: needs ---------- */
const N = SC.needs, nSpeak = SPEAK[3];
const nLab = el('WHAT YOU NEED', 'lab', { top: '600px', fontSize: '40px' });
const chipTexts = (CFG.chips || []).slice(0, 3);
const chips = chipTexts.map((c, i) => el('<i>✓</i><span>' + esc(String(c).toUpperCase()) + '</span>', 'chip', { top: (700 + i * 180) + 'px' }));
const nWords = kinetic(LINES[3], { y: 700 + chipTexts.length * 180 + 80, size: 70, maxH: 330, s: nSpeak.s, e: nSpeak.e });
const chipAt = chipTexts.map((_, i) => N.s + 0.3 + i * Math.min(0.45, Math.max(0.25, (nSpeak.e - N.s - 0.6) / Math.max(1, chipTexts.length))));
chipAt.forEach(t0 => sfx(t0, 'pop', 0.75));

/* ---------- scene 5: comment JOB ---------- */
const C = SC.cta, cSpeak = SPEAK[4];
const cSo = el('SO COMMENT', '', { top: '600px', fontSize: '78px', fontWeight: '900', whiteSpace: 'nowrap' }); centerX(cSo);
const cBtn = el(EM('1f4ac') + '<span>' + esc(String(CFG.button || 'Comment JOB').replace(/^comment\s*/i, '').toUpperCase() || 'JOB') + '</span>', 'btn', { top: '730px' }); centerX(cBtn);
const rings = [0, 1, 2].map(() => el('', 'ring', {}));
const cWords = kinetic(LINES[4], { y: 1090, size: 62, maxH: 300, s: cSpeak.s, e: cSpeak.e });
const cList = ['DIRECT LINK', 'SIGNUP → FIRST PROJECT GUIDE'].map((s, i) => el('<i>✓</i><span>' + esc(s) + '</span>', 'box', { left: '170px', top: (1440 + i * 96) + 'px' }));
sfx(C.s + 0.35, 'pop', 1); sfx(C.s + 0.75, 'ding', 0.7);

/* ---------- outro: follow ---------- */
const O = { s: C.e, e: END };
const oBell = el(EM('1f514'), '', { top: '680px', fontSize: '170px', lineHeight: '1' }); centerX(oBell);
const oFollow = el('FOLLOW', '', { top: '890px', fontSize: '200px', fontWeight: '900', letterSpacing: '-6px', whiteSpace: 'nowrap', textShadow: '0 0 40px rgba(255,255,255,.25)' }); centerX(oFollow);
const oHandle = el('@' + esc(CFG.domain || 'remotejobdrop.online'), '', { top: '1130px', fontSize: '52px', fontWeight: '900', color: Y, whiteSpace: 'nowrap' }); centerX(oHandle);
const oNew = el('NEW <span style="color:#FACC15">JOBS</span> DAILY', '', { top: '1230px', fontSize: '64px', fontWeight: '900', whiteSpace: 'nowrap' }); centerX(oNew);
sfx(O.s + 0.1, 'whoosh', 0.8); sfx(O.s + 0.35, 'ding', 0.8);

/* ---------- render ---------- */
window.TL = { END };
window.render = function (t) {
  /* background: two slow amber glows */
  const g1 = document.getElementById('g1'), g2 = document.getElementById('g2');
  Object.assign(g1.style, { left: (520 + 80 * Math.sin(t * 0.35)) + 'px', top: (1180 + 90 * Math.cos(t * 0.3)) + 'px', width: '1300px', height: '1300px', marginLeft: '-650px', marginTop: '-650px',
    background: 'radial-gradient(circle,rgba(214,120,10,.42) 0%,rgba(140,70,0,.18) 40%,rgba(0,0,0,0) 70%)' });
  Object.assign(g2.style, { left: (260 + 60 * Math.cos(t * 0.27)) + 'px', top: (520 + 70 * Math.sin(t * 0.33)) + 'px', width: '900px', height: '900px', marginLeft: '-450px', marginTop: '-450px',
    background: 'radial-gradient(circle,rgba(250,190,40,.16) 0%,rgba(0,0,0,0) 65%)' });
  document.getElementById('prog').style.width = (1080 * clamp(t / END)) + 'px';
  floats.forEach((f, i) => { const base = t < H.e ? 0.16 : t < O.s ? 0.07 : 0.05; f.style.opacity = base * (0.6 + 0.4 * Math.sin(t * 0.7 + i));
    f.style.transform = `translate(${12 * Math.sin(t * 0.4 + i * 1.3)}px,${-t * (4 + i % 3 * 2)}px)`; });

  /* hook */
  const hOn = t < H.e + 0.05; [hBig, hSub, hCount, hEmoji, hWords.box, hPay].forEach(e => e && vis(e, hOn));
  if (hOn) {
    if (hBig) { popIn(hBig, t, H.s + 0.05, 0.5, { from: 1.35, blur: 26 }); hBig.style.transform += ` translateY(${-6 * Math.sin(t * 1.6)}px)`; popIn(hSub, t, H.s + 0.35, 0.35, { y: 16 }); popIn(hCount, t, H.s + 0.55, 0.35, { y: 10 }); }
    if (hEmoji) { popIn(hEmoji, t, H.s + 0.05, 0.5, { bounce: true, from: 0.2 }); hEmoji.style.transform += ` rotate(${6 * Math.sin(t * 2.2)}deg)`; }
    if (hPay) { popIn(hPay, t, H.s + 0.02, 0.4, { bounce: true, from: 0.4, blur: 8 }); hPay.style.transform += ` scale(${1 + 0.02 * Math.sin(t * 4)})`; }
    kineticRender(hWords, t); [hBig, hSub, hCount, hEmoji, hWords.box, hPay].forEach(e => e && fadeOut(e, t, H.e + 0.05));
  }
  /* title */
  const tOn = t >= T.s - 0.02 && t < T.e + 0.05; [tTag, tTitle, tWords.box].forEach(e => vis(e, tOn));
  if (tOn) {
    popIn(tTag, t, T.s + 0.1, 0.4, { bounce: true, from: 0.3, rot: -5, blur: 6 });
    popIn(tTitle, t, T.s + 0.2, 0.45, { y: 30, from: 1.15, blur: 20 });
    kineticRender(tWords, t); [tTag, tTitle, tWords.box].forEach(e => fadeOut(e, t, T.e + 0.05));
  }
  /* pay */
  const pOn = t >= P.s - 0.02 && t < P.e + 0.05; [pLab, pBig, pUnit, pPill, pInr, ...sparks].forEach(e => vis(e, pOn));
  if (pOn) {
    popIn(pLab, t, P.s + 0.08, 0.35, { y: 14 });
    popIn(pBig, t, pReveal, 0.5, { bounce: true, from: 0.35, blur: 24 }); pBig.style.transform += ` scale(${1 + 0.015 * Math.sin(t * 5)})`;
    popIn(pUnit, t, pReveal + 0.25, 0.35, { y: 20 }); popIn(pPill, t, pReveal + 0.55, 0.4, { bounce: true, from: 0.5, blur: 8 }); popIn(pInr, t, pReveal + 0.75, 0.35, { y: 12 });
    const cx = 540, cy = 730 + pBig.offsetHeight / 2;
    sparks.forEach((s, i) => { const a = i / sparks.length * Math.PI * 2 + i * 0.37, age = t - pReveal - (i % 5) * 0.06;
      const r = 220 + 380 * eo(age / 1.4) + (i % 4) * 30; s.style.left = (cx + r * Math.cos(a) * 1.05 - 7) + 'px'; s.style.top = (cy + r * Math.sin(a) * 0.62 - 7) + 'px';
      s.style.opacity = age < 0 ? 0 : (0.25 + 0.75 * Math.abs(Math.sin(t * 6 + i))) * (1 - 0.6 * clamp(age / 2.5)); s.style.transform = `scale(${0.5 + (i % 3) * 0.4})`; });
    [pLab, pBig, pUnit, pPill, pInr].forEach(e => fadeOut(e, t, P.e + 0.05));
  }
  /* needs */
  const nOn = t >= N.s - 0.02 && t < N.e + 0.05; [nLab, ...chips, nWords.box].forEach(e => vis(e, nOn));
  if (nOn) {
    popIn(nLab, t, N.s + 0.08, 0.35, { y: 12 });
    chips.forEach((c, i) => { const p = clamp((t - chipAt[i]) / 0.4); c.style.opacity = t < chipAt[i] ? 0 : eo(p); c.style.transform = `translateX(${-160 * (1 - eo(p))}px) scale(${lerp(0.9, 1, eb(p))})`; c.style.filter = p < 1 ? `blur(${10 * (1 - eo(p))}px)` : '';
      const ic = c.querySelector('i'); ic.style.transform = `scale(${t < chipAt[i] + 0.15 ? 0 : eb(clamp((t - chipAt[i] - 0.15) / 0.3))})`; });
    kineticRender(nWords, t); [nLab, ...chips, nWords.box].forEach(e => fadeOut(e, t, N.e + 0.05));
  }
  /* comment JOB */
  const cOn = t >= C.s - 0.02 && t < C.e + 0.05; [cSo, cBtn, ...rings, cWords.box, ...cList].forEach(e => vis(e, cOn));
  if (cOn) {
    popIn(cSo, t, C.s + 0.08, 0.35, { y: 14 });
    popIn(cBtn, t, C.s + 0.35, 0.45, { bounce: true, from: 0.3, blur: 10 }); if (t > C.s + 0.8) cBtn.style.transform += ` scale(${1 + 0.03 * Math.sin((t - C.s) * 6)})`;
    const bx = cBtn.offsetLeft, by = cBtn.offsetTop, bw = cBtn.offsetWidth, bh = cBtn.offsetHeight;
    rings.forEach((r, i) => { const ph = ((t - C.s - 0.6) * 0.8 + i / 3) % 1; const on = t > C.s + 0.6; const g = 1 + 0.5 * ph;
      Object.assign(r.style, { left: (bx + bw / 2 - bw * g / 2) + 'px', top: (by + bh / 2 - bh * g / 2) + 'px', width: bw * g + 'px', height: bh * g + 'px', opacity: on ? 0.7 * (1 - ph) : 0 }); });
    kineticRender(cWords, t);
    cList.forEach((b, i) => { const st = Math.min(C.e - 0.9, cSpeak.s + 0.6 + i * 0.45); popIn(b, t, st, 0.35, { y: 16, blur: 8 }); const ic = b.querySelector('i');
      const done = t > st + 0.3; ic.textContent = done ? '✓' : ''; ic.style.background = done ? '#FFFFFF' : 'transparent'; });
    [cSo, cBtn, cWords.box, ...cList].forEach(e => fadeOut(e, t, C.e + 0.05)); rings.forEach(r => { if (t > C.e - 0.2) r.style.opacity = 0; });
  }
  /* follow */
  const oOn = t >= O.s - 0.02; [oBell, oFollow, oHandle, oNew].forEach(e => vis(e, oOn));
  if (oOn) {
    popIn(oBell, t, O.s + 0.05, 0.4, { bounce: true, from: 0.2 }); oBell.style.transform += ` rotate(${14 * Math.sin((t - O.s) * 9) * Math.exp(-(t - O.s) * 1.2)}deg)`; oBell.style.transformOrigin = '50% 10%';
    popIn(oFollow, t, O.s + 0.2, 0.45, { from: 1.4, blur: 24 }); popIn(oHandle, t, O.s + 0.5, 0.35, { y: 16 }); popIn(oNew, t, O.s + 0.7, 0.35, { y: 16 });
  }
  document.body.style.opacity = 1 - clamp((t - (END - 0.3)) / 0.3);
};
